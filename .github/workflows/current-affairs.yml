name: Daily Current Affairs

# Fetches news, summarizes it, generates MCQs, and opens a PR with the
# result — nothing reaches main (and therefore nothing deploys) until a
# human reads the generated MCQs and merges. See
# tools/current-affairs/build.mjs and DEVLOG.md for the full design.
#
# Requires four repo secrets (Settings → Secrets and variables → Actions):
# NEWSDATA_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, and GH_PAT.
#
# GH_PAT exists because "Settings → Actions → General → Workflow permissions
# → Allow GitHub Actions to create and approve pull requests" would not
# persist when saved for this repo (retested three ways, always reverted on
# reload — looks like an org/enterprise policy overriding it, not something
# fixable from repo settings). That toggle only governs the auto-generated
# GITHUB_TOKEN; a personal access token isn't subject to it. GH_PAT should
# be a fine-grained PAT scoped to just this repo, with Contents: Read and
# write + Pull requests: Read and write permissions.

on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 06:00 IST
  workflow_dispatch: {} # manual trigger, for testing before trusting the schedule

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate today's current affairs
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node tools/current-affairs/build.mjs

      - name: Capture today's date
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Open PR with today's content
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: 'Current affairs: ${{ steps.date.outputs.value }}'
          title: 'Current affairs: ${{ steps.date.outputs.value }}'
          body: |
            Auto-generated by the Daily Current Affairs workflow.

            **Read the MCQs before merging** — this is LLM-generated content
            and the whole point of this PR gate is to catch a bad day before
            it reaches students. Once merged, Vercel's normal deploy picks it
            up automatically.
          branch: current-affairs/auto-update
          delete-branch: true
          add-paths: |
            public/data/current-affairs/*.json
