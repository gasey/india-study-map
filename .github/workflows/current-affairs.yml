name: Daily Current Affairs

# Fetches news, summarizes it, generates MCQs, and pushes the result to a
# dedicated branch — nothing reaches main (and therefore nothing deploys)
# until a human reads the generated MCQs and opens+merges the PR
# themselves. See tools/current-affairs/build.mjs and DEVLOG.md for the
# full design.
#
# Requires four repo secrets (Settings → Secrets and variables → Actions):
# NEWSDATA_API_KEY, GEMINI_API_KEY, GROQ_API_KEY, and GH_PAT.
#
# GH_PAT exists because the automated PR-creation API call is blocked for
# this repo by something outside repo settings — tried both the repo's
# own "Allow GitHub Actions to create and approve pull requests" toggle
# (wouldn't persist across 3 attempts) AND a fine-grained PAT with
# Pull requests: write (got "Resource not accessible by personal access
# token" specifically on the create-PR call, even though the branch push
# itself succeeded with the same token) — same failure point both times,
# pointing at an org/enterprise policy rather than a scoping mistake. So
# this workflow only pushes the branch (which does work) and leaves
# opening the actual PR to a human via the "Compare & pull request"
# banner GitHub shows automatically for a pushed branch. GH_PAT still
# needs Contents: Read and write (Pull requests scope is no longer
# required, but harmless to leave on).

on:
  schedule:
    - cron: '30 0 * * *' # 00:30 UTC = 06:00 IST
  workflow_dispatch: {} # manual trigger, for testing before trusting the schedule

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Generate today's current affairs
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node tools/current-affairs/build.mjs

      - name: Capture today's date
        id: date
        run: echo "value=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Push today's content to a review branch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "current-affairs-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B current-affairs/auto-update
          git add public/data/current-affairs/
          if git diff --cached --quiet; then
            echo "[current-affairs] no changes to commit — today's file matched what's already there"
            exit 0
          fi
          git commit -m "Current affairs: ${{ steps.date.outputs.value }}"
          git push "https://x-access-token:${GH_PAT}@github.com/${{ github.repository }}.git" HEAD:current-affairs/auto-update --force
          echo "::notice::Pushed current-affairs/auto-update — open a PR from that branch on GitHub to review and merge."
