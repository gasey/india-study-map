<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bhārat — Interactive Study Map</title>
    <meta name="description" content="An interactive study map of India for competitive exam preparation." />

    <!-- Android / Chrome -->
    <meta name="theme-color" content="#fbf8f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS Safari: add-to-home-screen behaves like a standalone app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bhārat Atlas" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Anti-FOUC: paint the right theme before React mounts.
         This MUST stay in step with src/lib/applyTheme.ts — it is the same
         decision, made twice. It reads `skin` as well as `theme`: the
         collectible skin is light-only, so a persisted theme of 'dark'
         must NOT win over it. When this script only knew about `theme`, a
         dark+collectible session painted the ink theme first and the whole
         rail resolved its colours against it. */
      (function () {
        try {
          var raw = localStorage.getItem('india-study-map');
          var state = (raw && JSON.parse(raw).state) || {};
          /* Collectible is the default, so an absent `skin` means
             collectible — not "default". A stored value still wins, which
             is how a deliberate switch back survives a reload. Getting the
             fallback wrong here paints the old theme for one frame before
             React corrects it. */
          var collectible = (state.skin || 'collectible') === 'collectible';
          var dark = !collectible && state.theme === 'dark';
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.setAttribute(
            'data-theme',
            collectible ? 'collectible' : dark ? 'ink' : 'paper'
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'paper');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
