<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Title -->
  <text x="200" y="18" font-family="serif" font-size="13" fill="#333" text-anchor="middle">Four positions of a dice</text>

  <!-- Dice 1 -->
  <g transform="translate(60, 100)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#333"/>
    <text x="0" y="55" font-family="serif" font-size="11" fill="#666" text-anchor="middle">Position 1</text>
  </g>

  <!-- Dice 2 -->
  <g transform="translate(140, 100)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <circle cx="-12" cy="-12" r="5" fill="#333"/>
    <circle cx="12" cy="12" r="5" fill="#333"/>
    <text x="0" y="55" font-family="serif" font-size="11" fill="#666" text-anchor="middle">Position 2</text>
  </g>

  <!-- Dice 3 -->
  <g transform="translate(220, 100)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <circle cx="-12" cy="-12" r="5" fill="#333"/>
    <circle cx="0" cy="0" r="5" fill="#333"/>
    <circle cx="12" cy="12" r="5" fill="#333"/>
    <text x="0" y="55" font-family="serif" font-size="11" fill="#666" text-anchor="middle">Position 3</text>
  </g>

  <!-- Dice 4 -->
  <g transform="translate(300, 100)">
    <rect x="-30" y="-30" width="60" height="60" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
    <circle cx="-12" cy="-12" r="5" fill="#333"/>
    <circle cx="12" cy="-12" r="5" fill="#333"/>
    <circle cx="-12" cy="12" r="5" fill="#333"/>
    <circle cx="12" cy="12" r="5" fill="#333"/>
    <text x="0" y="55" font-family="serif" font-size="11" fill="#666" text-anchor="middle">Position 4</text>
  </g>

  <!-- Question -->
  <text x="200" y="185" font-family="serif" font-size="12" fill="#333" text-anchor="middle">Find the number on the face opposite to the face showing 2</text>
</svg>