<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Title -->
  <text x="200" y="18" font-family="serif" font-size="13" fill="#333" text-anchor="middle">Mirror image with line AB</text>

  <!-- Mirror line AB -->
  <line x1="200" y1="30" x2="200" y2="170" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="205" y="28" font-family="serif" font-size="12" fill="#333">A</text>
  <text x="205" y="185" font-family="serif" font-size="12" fill="#333">B</text>

  <!-- Original figure (left of mirror) -->
  <g transform="translate(120, 100)">
    <!-- Triangle with inscribed circle -->
    <polygon points="0,-30 30,20 -30,20" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="12" fill="#fff" stroke="#2c5f8a" stroke-width="1"/>
    <circle cx="0" cy="0" r="6" fill="#e74c3c"/>
    <!-- Hollow circle at top-right -->
    <circle cx="25" cy="-20" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <!-- Solid dot at bottom-right -->
    <circle cx="25" cy="15" r="5" fill="#333"/>
    <!-- Arrow -->
    <line x1="-40" y1="0" x2="-15" y2="0" stroke="#333" stroke-width="2"/>
    <polygon points="-15,-4 -15,4 -8,0" fill="#333"/>
    <text x="0" y="45" font-family="serif" font-size="11" fill="#666" text-anchor="middle">Original</text>
  </g>

  <!-- Mirror image (right of mirror) -->
  <g transform="translate(280, 100) scale(-1,1)">
    <polygon points="0,-30 30,20 -30,20" fill="#e8f4fc" stroke="#2c5f8a" stroke-width="1.5" stroke-dasharray="4,2"/>
    <circle cx="0" cy="0" r="12" fill="#fff" stroke="#2c5f8a" stroke-width="1"/>
    <circle cx="0" cy="0" r="6" fill="#e74c3c"/>
    <circle cx="25" cy="-20" r="5" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <circle cx="25" cy="15" r="5" fill="#333"/>
    <line x1="-40" y1="0" x2="-15" y2="0" stroke="#333" stroke-width="2"/>
    <polygon points="-15,-4 -15,4 -8,0" fill="#333"/>
    <text x="0" y="45" font-family="serif" font-size="11" fill="#666" text-anchor="middle">Mirror</text>
  </g>

  <!-- Answer options -->
  <text x="200" y="195" font-family="serif" font-size="11" fill="#333" text-anchor="middle">Which answer figure is the exact mirror image?</text>
</svg>