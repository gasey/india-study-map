<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Mirror line MN -->
  <line x1="200" y1="20" x2="200" y2="180" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="205" y="18" font-family="serif" font-size="14" fill="#333">M</text>
  <text x="205" y="195" font-family="serif" font-size="14" fill="#333">N</text>

  <!-- Original figure (left of mirror) -->
  <g transform="translate(120, 100)">
    <!-- Arrow shape -->
    <polygon points="0,-30 20,-15 20,-25 50,-25 50,25 20,25 20,15 0,30" fill="#4a90d9" stroke="#2c5f8a" stroke-width="1.5"/>
    <text x="10" y="55" font-family="serif" font-size="12" fill="#333">Original</text>
  </g>

  <!-- Mirror image (right of mirror) -->
  <g transform="translate(280, 100) scale(-1,1)">
    <polygon points="0,-30 20,-15 20,-25 50,-25 50,25 20,25 20,15 0,30" fill="#e8f4fc" stroke="#2c5f8a" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="10" y="55" font-family="serif" font-size="12" fill="#666">Mirror</text>
  </g>

  <!-- Labels -->
  <text x="120" y="30" font-family="serif" font-size="11" fill="#666">Given figure</text>
  <text x="260" y="30" font-family="serif" font-size="11" fill="#666">Answer figure</text>
</svg>