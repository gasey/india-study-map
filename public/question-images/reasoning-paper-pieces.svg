<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <!-- Title -->
  <text x="200" y="18" font-family="serif" font-size="13" fill="#333" text-anchor="middle">Paper folding / pieces</text>

  <!-- Figure X (pieces) -->
  <g transform="translate(80, 100)">
    <rect x="-35" y="-35" width="70" height="70" fill="#fff" stroke="#333" stroke-width="2"/>
    <line x1="-35" y1="0" x2="35" y2="0" stroke="#999" stroke-width="1"/>
    <line x1="0" y1="-35" x2="0" y2="35" stroke="#999" stroke-width="1"/>
    <polygon points="-35,-35 0,-35 0,0 -35,0" fill="#4a90d9" opacity="0.3"/>
    <polygon points="0,0 35,0 35,35 0,35" fill="#e74c3c" opacity="0.3"/>
    <text x="0" y="55" font-family="serif" font-size="11" fill="#666" text-anchor="middle">Figure (X)</text>
  </g>

  <!-- Arrow -->
  <path d="M 130 100 L 170 100" stroke="#666" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>

  <!-- Answer figures -->
  <g transform="translate(210, 100)">
    <rect x="-25" y="-25" width="50" height="50" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <polygon points="-25,-25 0,-25 0,0 -25,0" fill="#4a90d9" opacity="0.3"/>
    <text x="0" y="40" font-family="serif" font-size="10" fill="#666" text-anchor="middle">(1)</text>
  </g>

  <g transform="translate(270, 100)">
    <rect x="-25" y="-25" width="50" height="50" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <polygon points="0,0 25,0 25,25 0,25" fill="#e74c3c" opacity="0.3"/>
    <text x="0" y="40" font-family="serif" font-size="10" fill="#666" text-anchor="middle">(2)</text>
  </g>

  <g transform="translate(330, 100)">
    <rect x="-25" y="-25" width="50" height="50" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <polygon points="-25,0 0,0 0,25 -25,25" fill="#2ecc71" opacity="0.3"/>
    <text x="0" y="40" font-family="serif" font-size="10" fill="#666" text-anchor="middle">(3)</text>
  </g>

  <g transform="translate(390, 100)">
    <rect x="-25" y="-25" width="50" height="50" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <polygon points="0,-25 25,-25 25,0 0,0" fill="#f39c12" opacity="0.3"/>
    <text x="0" y="40" font-family="serif" font-size="10" fill="#666" text-anchor="middle">(4)</text>
  </g>

  <!-- Question -->
  <text x="200" y="185" font-family="serif" font-size="12" fill="#333" text-anchor="middle">Which figure can be formed from the pieces in figure (X)?</text>
</svg>